<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>
@font-face{font-family:Oswald;src:url(fonts/Oswald-Variable.ttf);font-weight:200 700}
@font-face{font-family:Inter;src:url(fonts/Inter-Variable.ttf);font-weight:100 900}
@font-face{font-family:'Space Mono';src:url(fonts/SpaceMono-Regular.ttf);font-weight:400}
@font-face{font-family:'Space Mono';src:url(fonts/SpaceMono-Bold.ttf);font-weight:700}</style><defs>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2B3037"/><stop offset="0.49" stop-color="#23272D"/>
  <stop offset="0.51" stop-color="#1D2126"/><stop offset="1" stop-color="#262A30"/>
</linearGradient>
<filter id="paper" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
</filter>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
  <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
</filter>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#000" opacity="0.18"/></pattern></defs><rect x="-50" y="-50" width="1700" height="1000" fill="#F2F0E9"/><text x="80" y="96" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="52" font-weight="600" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">The minimum fare, before a single event</text><text x="80" y="138" font-family="Inter, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#6B7079" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">What each option charges per month with no traffic at all, us-east-1</text><line x1="80" y1="262" x2="1520" y2="262" stroke="#C9C6BC" stroke-width="1" stroke-dasharray="2 5"/><text x="80" y="236" font-family="Inter, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">Data Firehose</text><rect x="520" y="214" width="2" height="30" fill="#16181B"/><text x="536" y="238" font-family="'Space Mono', Menlo, monospace" font-size="24" font-weight="700" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">$0</text><line x1="80" y1="332" x2="1520" y2="332" stroke="#C9C6BC" stroke-width="1" stroke-dasharray="2 5"/><text x="80" y="306" font-family="Inter, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">Kinesis provisioned</text><text x="80" y="328" font-family="Inter, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#6B7079" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">per shard</text><rect x="520" y="284" width="3.128888888888889" height="30" fill="#16181B"/><text x="537.1288888888889" y="308" font-family="'Space Mono', Menlo, monospace" font-size="24" font-weight="700" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">$10.80</text><line x1="80" y1="402" x2="1520" y2="402" stroke="#C9C6BC" stroke-width="1" stroke-dasharray="2 5"/><text x="80" y="376" font-family="Inter, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">Kinesis on-demand Standard</text><text x="80" y="398" font-family="Inter, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#6B7079" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">per stream</text><rect x="520" y="354" width="8.343703703703703" height="30" fill="#16181B"/><text x="542.3437037037037" y="378" font-family="'Space Mono', Menlo, monospace" font-size="24" font-weight="700" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">$28.80</text><line x1="80" y1="472" x2="1520" y2="472" stroke="#C9C6BC" stroke-width="1" stroke-dasharray="2 5"/><text x="80" y="446" font-family="Inter, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">Managed Flink (smallest app)</text><text x="80" y="468" font-family="Inter, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#6B7079" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">per application</text><rect x="520" y="424" width="47.33893004115227" height="30" fill="#16181B"/><text x="581.3389300411523" y="448" font-family="'Space Mono', Menlo, monospace" font-size="24" font-weight="700" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">$163.40</text><line x1="80" y1="542" x2="1520" y2="542" stroke="#C9C6BC" stroke-width="1" stroke-dasharray="2 5"/><text x="80" y="516" font-family="Inter, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">MSK, 3 x kafka.m7g.large</text><text x="80" y="538" font-family="Inter, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#6B7079" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">per cluster</text><rect x="520" y="494" width="127.65866666666668" height="30" fill="#16181B"/><text x="661.6586666666667" y="518" font-family="'Space Mono', Menlo, monospace" font-size="24" font-weight="700" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">$440.64</text><line x1="80" y1="612" x2="1520" y2="612" stroke="#C9C6BC" stroke-width="1" stroke-dasharray="2 5"/><text x="80" y="586" font-family="Inter, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">MSK Serverless</text><text x="80" y="608" font-family="Inter, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#6B7079" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">per cluster</text><rect x="520" y="564" width="156.44444444444446" height="30" fill="#16181B"/><text x="690.4444444444445" y="588" font-family="'Space Mono', Menlo, monospace" font-size="24" font-weight="700" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">$540</text><line x1="80" y1="682" x2="1520" y2="682" stroke="#C9C6BC" stroke-width="1" stroke-dasharray="2 5"/><text x="80" y="656" font-family="Inter, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">MSK Express, 3 x m7g.large</text><text x="80" y="678" font-family="Inter, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#6B7079" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">per cluster</text><rect x="520" y="634" width="255.31733333333335" height="30" fill="#16181B"/><text x="789.3173333333334" y="658" font-family="'Space Mono', Menlo, monospace" font-size="24" font-weight="700" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">$881.28</text><line x1="80" y1="752" x2="1520" y2="752" stroke="#C9C6BC" stroke-width="1" stroke-dasharray="2 5"/><text x="80" y="726" font-family="Inter, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">Kinesis on-demand Advantage</text><text x="80" y="748" font-family="Inter, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#6B7079" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">per account</text><rect x="520" y="704" width="880" height="30" fill="#D93A2E"/><text x="1414" y="728" font-family="'Space Mono', Menlo, monospace" font-size="24" font-weight="700" fill="#D93A2E" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">$3,037.50</text><text x="80" y="812" font-family="Inter, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">Freshness gets expensive through fixed charges like these, not through per-event prices.</text><text x="80" y="852" font-family="Inter, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6B7079" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">Flink: 1 KPU + 1 orchestration KPU + 50 GB storage. Advantage: 25 MB/s in and out minimum, account-wide. Source: AWS pricing pages and Price List API.</text><rect x="-50" y="-50" width="1700" height="1000" filter="url(#paper)"/></svg>
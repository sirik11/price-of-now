<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>
@font-face{font-family:Oswald;src:url(fonts/Oswald-Variable.ttf);font-weight:200 700}
@font-face{font-family:Inter;src:url(fonts/Inter-Variable.ttf);font-weight:100 900}
@font-face{font-family:'Space Mono';src:url(fonts/SpaceMono-Regular.ttf);font-weight:400}
@font-face{font-family:'Space Mono';src:url(fonts/SpaceMono-Bold.ttf);font-weight:700}</style><defs>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2B3037"/><stop offset="0.49" stop-color="#23272D"/>
  <stop offset="0.51" stop-color="#1D2126"/><stop offset="1" stop-color="#262A30"/>
</linearGradient>
<filter id="paper" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
</filter>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
  <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
</filter>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#000" opacity="0.18"/></pattern></defs><rect x="-50" y="-50" width="1700" height="1000" fill="#F2F0E9"/><text x="80" y="96" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="52" font-weight="600" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">You pay for the box, not the parcel</text><text x="80" y="138" font-family="Inter, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#6B7079" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">Box area is what a 500-byte event is billed as. Each parcel is 500 bytes. Rounding happens per record.</text><rect x="197" y="534" width="66" height="66" fill="#FFFFFF" stroke="#16181B" stroke-width="3" stroke-dasharray="6 5"/><rect x="198.5" y="535.5" width="63" height="63" rx="3" fill="#E89B0C" stroke="#9C6400" stroke-width="1.4"/><line x1="230" y1="537" x2="230" y2="597" stroke="#9C6400" stroke-width="1.2"/><text x="230" y="512" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="44" font-weight="600" fill="#16181B" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">1×</text><text x="230" y="652" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="23" font-weight="600" fill="#16181B" text-anchor="middle" letter-spacing="1" font-style="normal" xml:space="preserve">SENT</text><text x="230" y="682" font-family="Inter, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6B7079" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">one event</text><text x="230" y="726" font-family="'Space Mono', Menlo, monospace" font-size="20" font-weight="400" fill="#16181B" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">500 B</text><rect x="562.7742443152044" y="505.5484886304089" width="94.45151136959112" height="94.45151136959112" fill="#FFFFFF" stroke="#16181B" stroke-width="3" /><rect x="578.5" y="535.5" width="63" height="63" rx="3" fill="#E89B0C" stroke="#9C6400" stroke-width="1.4"/><line x1="610" y1="537" x2="610" y2="597" stroke="#9C6400" stroke-width="1.2"/><text x="610" y="483.5484886304089" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="44" font-weight="600" fill="#16181B" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">2×</text><text x="610" y="652" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="23" font-weight="600" fill="#16181B" text-anchor="middle" letter-spacing="1" font-style="normal" xml:space="preserve">KINESIS ON-DEMAND</text><text x="610" y="682" font-family="Inter, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6B7079" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">rounded up to the nearest 1 KB</text><text x="610" y="726" font-family="'Space Mono', Menlo, monospace" font-size="20" font-weight="400" fill="#16181B" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">billed as 1 KB</text><rect x="884.4" y="388.79999999999995" width="211.20000000000002" height="211.20000000000002" fill="#FFFFFF" stroke="#D93A2E" stroke-width="3" /><rect x="958.5" y="535.5" width="63" height="63" rx="3" fill="#E89B0C" stroke="#9C6400" stroke-width="1.4"/><line x1="990" y1="537" x2="990" y2="597" stroke="#9C6400" stroke-width="1.2"/><text x="990" y="366.79999999999995" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="44" font-weight="600" fill="#D93A2E" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">10×</text><text x="990" y="652" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="23" font-weight="600" fill="#D93A2E" text-anchor="middle" letter-spacing="1" font-style="normal" xml:space="preserve">FIREHOSE</text><text x="990" y="682" font-family="Inter, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6B7079" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">billed in 5 KB increments</text><text x="990" y="726" font-family="'Space Mono', Menlo, monospace" font-size="20" font-weight="400" fill="#16181B" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">billed as 5 KB</text><rect x="1264.4" y="388.79999999999995" width="211.20000000000002" height="211.20000000000002" fill="#FFFFFF" stroke="#1F9D61" stroke-width="3" /><rect x="1265.9" y="498.375" width="39.24" height="100.125" rx="3" fill="#E89B0C" stroke="#9C6400" stroke-width="1.4"/><line x1="1285.52" y1="499.875" x2="1285.52" y2="597" stroke="#9C6400" stroke-width="1.2"/><rect x="1308.14" y="498.375" width="39.24" height="100.125" rx="3" fill="#E89B0C" stroke="#9C6400" stroke-width="1.4"/><line x1="1327.76" y1="499.875" x2="1327.76" y2="597" stroke="#9C6400" stroke-width="1.2"/><rect x="1350.38" y="498.375" width="39.24" height="100.125" rx="3" fill="#E89B0C" stroke="#9C6400" stroke-width="1.4"/><line x1="1370" y1="499.875" x2="1370" y2="597" stroke="#9C6400" stroke-width="1.2"/><rect x="1392.6200000000001" y="498.375" width="39.24" height="100.125" rx="3" fill="#E89B0C" stroke="#9C6400" stroke-width="1.4"/><line x1="1412.24" y1="499.875" x2="1412.24" y2="597" stroke="#9C6400" stroke-width="1.2"/><rect x="1434.8600000000001" y="498.375" width="39.24" height="100.125" rx="3" fill="#E89B0C" stroke="#9C6400" stroke-width="1.4"/><line x1="1454.48" y1="499.875" x2="1454.48" y2="597" stroke="#9C6400" stroke-width="1.2"/><rect x="1265.9" y="395.25" width="39.24" height="100.125" rx="3" fill="#E89B0C" stroke="#9C6400" stroke-width="1.4"/><line x1="1285.52" y1="396.75" x2="1285.52" y2="493.875" stroke="#9C6400" stroke-width="1.2"/><rect x="1308.14" y="395.25" width="39.24" height="100.125" rx="3" fill="#E89B0C" stroke="#9C6400" stroke-width="1.4"/><line x1="1327.76" y1="396.75" x2="1327.76" y2="493.875" stroke="#9C6400" stroke-width="1.2"/><rect x="1350.38" y="395.25" width="39.24" height="100.125" rx="3" fill="#E89B0C" stroke="#9C6400" stroke-width="1.4"/><line x1="1370" y1="396.75" x2="1370" y2="493.875" stroke="#9C6400" stroke-width="1.2"/><rect x="1392.6200000000001" y="395.25" width="39.24" height="100.125" rx="3" fill="#E89B0C" stroke="#9C6400" stroke-width="1.4"/><line x1="1412.24" y1="396.75" x2="1412.24" y2="493.875" stroke="#9C6400" stroke-width="1.2"/><rect x="1434.8600000000001" y="395.25" width="39.24" height="100.125" rx="3" fill="#E89B0C" stroke="#9C6400" stroke-width="1.4"/><line x1="1454.48" y1="396.75" x2="1454.48" y2="493.875" stroke="#9C6400" stroke-width="1.2"/><text x="1370" y="366.79999999999995" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="44" font-weight="600" fill="#1F9D61" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">~1×</text><text x="1370" y="652" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="23" font-weight="600" fill="#1F9D61" text-anchor="middle" letter-spacing="1" font-style="normal" xml:space="preserve">FIREHOSE, BATCHED</text><text x="1370" y="682" font-family="Inter, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6B7079" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">10 events packed in one record</text><text x="1370" y="726" font-family="'Space Mono', Menlo, monospace" font-size="20" font-weight="400" fill="#16181B" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">5 KB for 10 events</text><line x1="80" y1="600" x2="1520" y2="600" stroke="#C9C6BC" stroke-width="2"/><text x="80" y="812" font-family="Inter, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">Kinesis provisioned charges per 25 KB PUT payload unit instead, so a 500-byte record pays for a unit it fills about a fiftieth of.</text><text x="80" y="852" font-family="Inter, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6B7079" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">Rules quoted from the Kinesis Data Streams and Data Firehose pricing pages (Direct PUT and Kinesis sources), October 2026.</text><rect x="-50" y="-50" width="1700" height="1000" filter="url(#paper)"/></svg>
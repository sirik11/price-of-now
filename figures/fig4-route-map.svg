<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>
@font-face{font-family:Oswald;src:url(fonts/Oswald-Variable.ttf);font-weight:200 700}
@font-face{font-family:Inter;src:url(fonts/Inter-Variable.ttf);font-weight:100 900}
@font-face{font-family:'Space Mono';src:url(fonts/SpaceMono-Regular.ttf);font-weight:400}
@font-face{font-family:'Space Mono';src:url(fonts/SpaceMono-Bold.ttf);font-weight:700}</style><defs>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2B3037"/><stop offset="0.49" stop-color="#23272D"/>
  <stop offset="0.51" stop-color="#1D2126"/><stop offset="1" stop-color="#262A30"/>
</linearGradient>
<filter id="paper" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
</filter>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
  <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
</filter>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#000" opacity="0.18"/></pattern></defs><rect x="-50" y="-50" width="1700" height="1000" fill="#F2F0E9"/><text x="80" y="96" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="52" font-weight="600" fill="#16181B" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">Which line do you need?</text><text x="80" y="138" font-family="Inter, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#6B7079" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">Start from who acts on the data, not from the word “real-time.” Fares are for the stream above.</text><path d="M200 470 L420 470" stroke="#16181B" stroke-width="16" stroke-linecap="round"/><path d="M420 470 L640 250 L1380 250" fill="none" stroke="#E89B0C" stroke-width="16" stroke-linejoin="round"/><rect x="1376" y="228" width="8" height="44" fill="#E89B0C"/><text x="690" y="226" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="19" font-weight="600" fill="#E89B0C" text-anchor="start" letter-spacing="1.5" font-style="normal" xml:space="preserve">A PERSON, EVERY FEW MINUTES</text><circle cx="1200" cy="250" r="17" fill="#FFF" stroke="#16181B" stroke-width="5"/><text x="1200" y="300" font-family="Inter, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#16181B" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">Firehose → S3, batched</text><text x="1200" y="326" font-family="'Space Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#6B7079" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">$72</text><path d="M420 470 L490 400 L1480 400" fill="none" stroke="#2464D6" stroke-width="16" stroke-linejoin="round"/><rect x="1476" y="378" width="8" height="44" fill="#2464D6"/><text x="690" y="376" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="19" font-weight="600" fill="#2464D6" text-anchor="start" letter-spacing="1.5" font-style="normal" xml:space="preserve">A SYSTEM, WITHIN SECONDS</text><circle cx="1060" cy="400" r="17" fill="#FFF" stroke="#16181B" stroke-width="5"/><text x="1060" y="450" font-family="Inter, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#16181B" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">Kinesis provisioned</text><text x="1060" y="476" font-family="'Space Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#6B7079" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">$139 · steady</text><circle cx="1390" cy="400" r="17" fill="#FFF" stroke="#16181B" stroke-width="5"/><text x="1390" y="450" font-family="Inter, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#16181B" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">Kinesis on-demand</text><text x="1390" y="476" font-family="'Space Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#6B7079" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">$667 · spiky</text><path d="M420 470 L510 560 L1380 560" fill="none" stroke="#1F9D61" stroke-width="16" stroke-linejoin="round"/><rect x="1376" y="538" width="8" height="44" fill="#1F9D61"/><text x="690" y="536" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="19" font-weight="600" fill="#1F9D61" text-anchor="start" letter-spacing="1.5" font-style="normal" xml:space="preserve">NEEDS WINDOWS, JOINS, STATE</text><circle cx="1200" cy="560" r="17" fill="#FFF" stroke="#16181B" stroke-width="5"/><text x="1200" y="610" font-family="Inter, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#16181B" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">+ Managed Flink</text><text x="1200" y="636" font-family="'Space Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#6B7079" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">from $163 per app</text><path d="M420 470 L660 710 L1380 710" fill="none" stroke="#7A43B6" stroke-width="16" stroke-linejoin="round"/><rect x="1376" y="688" width="8" height="44" fill="#7A43B6"/><text x="690" y="686" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="19" font-weight="600" fill="#7A43B6" text-anchor="start" letter-spacing="1.5" font-style="normal" xml:space="preserve">ALREADY ON KAFKA, MANY CONSUMERS</text><circle cx="1200" cy="710" r="17" fill="#FFF" stroke="#16181B" stroke-width="5"/><text x="1200" y="760" font-family="Inter, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#16181B" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">Amazon MSK</text><text x="1200" y="786" font-family="'Space Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#6B7079" text-anchor="middle" letter-spacing="0" font-style="normal" xml:space="preserve">from $465</text><circle cx="200" cy="470" r="34" fill="#FFF" stroke="#16181B" stroke-width="7"/><text x="200" y="542" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="20" font-weight="600" fill="#16181B" text-anchor="middle" letter-spacing="1.5" font-style="normal" xml:space="preserve">WHO ACTS</text><text x="200" y="566" font-family="Oswald, 'Arial Narrow', sans-serif" font-size="20" font-weight="600" fill="#16181B" text-anchor="middle" letter-spacing="1.5" font-style="normal" xml:space="preserve">ON THE DATA?</text><text x="80" y="852" font-family="Inter, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6B7079" text-anchor="start" letter-spacing="0" font-style="normal" xml:space="preserve">Batch the producer on every line. Kinesis fares include a Lambda consumer; MSK excludes cross-AZ client transfer.</text><rect x="-50" y="-50" width="1700" height="1000" filter="url(#paper)"/></svg>